<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クイズ大会 - 回答状況モニター</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/admin.css">
  <link rel="stylesheet" href="css/monitor.css">
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>

<body class="admin-layout">
  <header class="admin-nav">
    <div class="admin-logo">
      <span>📊</span>
      <span>回答状況モニター</span>
    </div>
    <div class="admin-nav-actions">
      <a href="admin.html" class="btn btn-primary" style="font-size: 0.9rem;">🎮 進行管理へ戻る</a>
      <a href="presentation.html" target="_blank" class="btn btn-secondary" style="font-size: 0.9rem;">📺 プレゼン画面</a>
    </div>
  </header>

  <main class="admin-main monitor-main">
    <section class="admin-card">
      <div class="admin-card-header monitor-heading">
        <div class="admin-card-title"><span>📝</span><span id="monitorQuestionLabel">回答一覧</span></div>
        <div class="answer-live-stats monitor-stats">
          <div class="mini-stat">
            <div class="mini-stat-num" id="statConnectedTeams">0</div>
            <div class="mini-stat-label">登録チーム</div>
          </div>
          <div class="mini-stat">
            <div class="mini-stat-num" id="statAnsweredTeams" style="color: #16a34a;">0</div>
            <div class="mini-stat-label">回答済み</div>
          </div>
          <div class="mini-stat">
            <div class="mini-stat-num" id="statUnansweredTeams" style="color: #dc2626;">0</div>
            <div class="mini-stat-label">未回答</div>
          </div>
        </div>
      </div>

      <p id="monitorAnswerTypeNote" class="monitor-note"></p>
      <div class="monitor-toolbar">
        <div style="display: flex; align-items: center; gap: 6px;">
          <label for="selectMonitorSort">ソート:</label>
          <select id="selectMonitorSort" class="form-input">
            <option value="id-asc">チームID 昇順</option>
            <option value="id-desc">チームID 降順</option>
            <option value="time-asc">回答時間 早い順</option>
            <option value="time-desc">回答時間 遅い順</option>
            <option value="score-desc">累計得点 高い順</option>
            <option value="score-asc">累計得点 低い順</option>
          </select>
        </div>
        <div class="monitor-legend">
          <span class="grade-correct">⭕ 正解</span>
          <span class="grade-incorrect">❌ 不正解</span>
          <span class="grade-pending">⚪ 未採点</span>
        </div>
      </div>
      <div class="monitor-table-scroll">
        <table class="live-team-table">
          <thead>
            <tr>
              <th class="sortable" id="thSortId" data-sort="id">ID</th>
              <th>チーム名</th>
              <th>回答</th>
              <th class="sortable" id="thSortTime" data-sort="time">回答時間</th>
              <th class="sortable" id="thSortScore" data-sort="score" style="text-align: right;">累計得点</th>
            </tr>
          </thead>
          <tbody id="teamMonitorBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/firebase-config.js"></script>
  <script src="js/questions-data.js"></script>
  <script src="js/questions-order.js"></script>
  <script src="js/score-engine.js"></script>
  <script src="js/quiz-store.js"></script>
  <script src="js/monitor.js"></script>
</body>

</html>
