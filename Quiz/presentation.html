<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クイズ大会 - プレゼンテーション表示</title>
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/presentation.css">

  <!-- Firebase App & Realtime Database SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="presentation-body">

  <!-- 水位上昇アニメーション背景 (回答率 0%〜100% で上昇) -->
  <div class="water-bg-container" id="waterContainer">
    <div class="water-fill">
      <div class="water-wave wave-back"></div>
      <div class="water-wave wave-front"></div>
    </div>
  </div>

  <!-- 回答済みチーム数バッジ (右下) -->
  <div class="answer-count-badge" id="answerBadge">
    <span class="bubble-icon">💧</span>
    <span id="answeredCount">0</span> / <span id="targetCount">100</span> 組
    <span style="font-size: 0.95rem; color: #0284c7; margin-left: 6px;">(<span id="answeredPercent">0</span>%)</span>
  </div>

  <!-- メイン表示領域 -->
  <div class="pres-container">
    
    <!-- 上部ヘッダー -->
    <header class="pres-header">
      <div style="display: flex; align-items: center; gap: 14px;">
        <div class="pres-q-badge" id="qNumberBadge">Q 1</div>
        <div class="pres-double-badge" id="presDoubleBadge" style="display: none;">🌟 DOUBLE POINTS (得点2倍!)</div>
      </div>
      <div class="pres-status-badge" id="sceneStatusBadge">待機中</div>
    </header>

    <!-- メイン出題・選択肢エリア (中央揃え・見切れ防止) -->
    <main class="pres-main" id="presMain">
      
      <!-- 1. 問題画像 (あれば表示・中央揃え) -->
      <div class="pres-image-wrapper" id="presImageWrapper" style="display: none;">
        <img id="presQuestionImage" src="" alt="問題画像">
      </div>

      <!-- 2. 問題文 (中央揃え) -->
      <h1 class="pres-question-text" id="presQuestionText">問題文を読み込んでいます...</h1>

      <!-- 3. 制限時間バー (中央揃え) -->
      <div class="pres-timer-container" id="presTimerContainer">
        <div class="pres-timer-track">
          <div class="pres-timer-fill" id="presTimerFill"></div>
        </div>
        <div class="pres-timer-seconds" id="presTimerSeconds">15s</div>
      </div>

      <!-- 4. 選択肢: 2列配置 (◯◯ / ◯◯ / ◯◯) -->
      <div class="pres-options-grid" id="presOptionsGrid">
        <!-- JSで動的に2〜6個生成 -->
      </div>
      <div class="pres-text-answer-notice" id="presTextAnswerNotice" style="display: none;">
        回答は参加者のスマートフォンから入力します
      </div>

      <!-- 5. 正解発表時の解説ボックス -->
      <div class="pres-explanation-box" id="presExplanationBox" style="display: none;">
        <div class="pres-explanation-title">【解説】</div>
        <p id="presExplanationText"></p>
      </div>

    </main>

    <!-- 特殊全画面表示 (待機中 / 最終結果発表) -->
    <div class="pres-special-view" id="specialView" style="display: none;">
      <h2 class="pres-special-title" id="specialTitle">まもなく開始します</h2>
      <p id="specialSubtitle" style="font-size: 1.4rem; color: #64748b; text-align: center; max-width: 800px;">
        スマートフォンの画面を開き、運営者の合図をお待ちください。
      </p>

      <!-- 最終結果発表: 5位〜1位アニメーション表示コンテナ -->
      <div class="ranking-reveal-container" id="rankingRevealContainer" style="display: none;">
        
        <!-- 操作バー (司会用ボタン: 次へ、自動再生、全一覧切替) -->
        <div class="ranking-control-bar" id="rankingControlBar" style="display: none;">
          <button type="button" class="btn btn-primary" id="btnRevealNextRank" style="font-size: 1.1rem; padding: 10px 24px;">
            ▶ 次の順位を発表する
          </button>
          <button type="button" class="btn btn-secondary" id="btnAutoRevealRanks" style="font-size: 0.95rem;">
            ⏩ 1位まで自動再生
          </button>
          <button type="button" class="btn btn-secondary" id="btnToggleFullRanking" style="font-size: 0.95rem;">
            📋 全体ランキング表
          </button>
          <button type="button" class="btn btn-secondary" id="btnResetReveal" style="font-size: 0.85rem;" title="発表を最初からやり直す">
            🔄 最初から
          </button>
        </div>

        <!-- 5位から1位までのカードスタック -->
        <div class="ranking-cards-stack" id="rankingCardsStack">
          <!-- JSで動的生成 -->
        </div>

        <!-- 全体ランキングテーブル (切り替え表示) -->
        <div id="fullRankingView" style="width: 100%; max-height: 55vh; overflow-y: auto; display: none;">
          <!-- JSで動的生成 -->
        </div>

      </div>
    </div>

  </div>

  <aside class="player-qr-panel" id="playerQrPanel" aria-hidden="true">
    <button type="button" class="player-qr-close" id="btnClosePlayerQr" aria-label="QR表示を閉じる">&times;</button>
    <h1>スマートフォンで回答</h1>
    <div id="playerQrCode"></div>
    <a id="playerQrUrl" href="https://kaiser0226.github.io/Quiz/player.html">https://kaiser0226.github.io/Quiz/player.html</a>
  </aside>

  <!-- スクリプト群 -->
  <script src="js/firebase-config.js"></script>
  <script src="js/questions-data.js"></script>
  <script src="js/questions-order.js"></script>
  <script src="js/score-engine.js"></script>
  <script src="js/quiz-store.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/presentation.js"></script>
</body>
</html>
